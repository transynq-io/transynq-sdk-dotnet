name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build (warnings are errors; this is the lint)
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Pack
        run: dotnet pack src/Transynq.Sdk -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install DocFX
        run: dotnet tool update -g docfx
      - name: Build API reference
        run: docfx docfx.json --warningsAsErrors false
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: _site/
